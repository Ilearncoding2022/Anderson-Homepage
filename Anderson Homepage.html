<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anderson Homepage v1.7 (2025-10-22)</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="overlay"></div>
    
    <header class="header">
        <div class="header-left">
            <h1>🚀 Anderson Homepage v1.7 (2025-10-22)</h1>
        </div>
        <div class="header-search">
            <form id="searchForm" class="search-form">
                <input type="text" id="searchInput" class="search-input" placeholder="Search Google..." autocomplete="off">
                <button type="submit" class="search-button">🔍</button>
            </form>
        </div>
        <div class="header-center">
            <div id="clock" class="digital-clock">
                <div class="clock-date">Loading...</div>
                <div class="clock-time">--:--</div>
                <div class="clock-timezone">Local Time</div>
            </div>
            <div id="clock2" class="digital-clock clock-secondary">
                <div class="clock-date">Loading...</div>
                <div class="clock-time">--:--</div>
                <div class="clock-timezone">UTC</div>
            </div>
        </div>
        <div class="controls">
            <button class="hamburger-btn" id="hamburgerBtn" title="Menu">☰</button>
            <button class="theme-toggle" id="themeToggle" title="Toggle Theme">🌙</button>
        </div>
    </header>

    <!-- ============================================ -->
    <!-- DROPDOWN MENU - UPDATED WITH SIZE LABEL -->
    <!-- ============================================ -->
    <div class="dropdown-menu" id="dropdownMenu">
        <!-- View Layout Section -->
        <div class="dropdown-section">
            <label class="dropdown-label">View Layout</label>
            <div class="view-toggle">
                <button id="gridView" class="active" title="Grid View">⊞</button>
                <button id="listView" title="List View">☰</button>
            </div>
        </div>
        
        <!-- Icon Size Section - WITH LABEL -->
        <div class="dropdown-section">
            <label class="dropdown-label">Icon Size</label>
            
            <!-- Slider Container with Label -->
            <div class="size-slider-container">
                <input type="range" 
                       class="size-slider" 
                       id="sizeSlider" 
                       min="20" 
                       max="100" 
                       value="80" 
                       step="5" 
                       title="Adjust Icon Size">
                <span class="size-label" id="sizeLabel">80px</span>
            </div>
            
            <!-- Reference Markers -->
            <div class="size-markers">
                <span>20</span>
                <span>40</span>
                <span>60</span>
                <span>80</span>
                <span>100</span>
            </div>
        </div>
        
        <div class="dropdown-divider"></div>
        
        <!-- Action Buttons -->
        <button class="dropdown-item" id="addGroupBtn">📁 Add Group</button>
        <button class="dropdown-item" id="addWebsiteBtn">+ Add Website</button>
        
        <div class="dropdown-divider"></div>
        
        <button class="dropdown-item" id="settingsBtn">⚙️ Settings</button>
    </div>

    <!-- Main Content Container -->
    <div class="container">
        <div class="empty-state" id="emptyState" style="display: none;">
            <h2>No websites added yet</h2>
            <p>Click "Add Website" or "Add Group" to get started!</p>
        </div>
        <div id="mainContainer"></div>
    </div>

    <!-- Modal container for dynamically created modals -->
    <div id="modalContainer"></div>

    <!-- Settings Modal -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Settings</h2>
                <button class="close-modal" id="closeSettings">×</button>
            </div>
            <div class="form-group">
                <label for="bgImage">Background Image</label>
                <div class="file-input-wrapper">
                    <input type="file" id="bgImage" accept="image/*">
                    <label for="bgImage" class="file-input-label">
                        Choose background image
                    </label>
                </div>
            </div>
            <div class="form-group">
                <label for="bgPosition">Background Position</label>
                <select id="bgPosition">
                    <option value="cover" selected>Fill (Cover)</option>
                    <option value="contain">Fit (Contain)</option>
                    <option value="stretch">Stretch</option>
                    <option value="stretch-horizontal">Stretch Horizontal</option>
                    <option value="stretch-vertical">Stretch Vertical</option>
                    <option value="center">Center (Original Size)</option>
                    <option value="tile">Tile (Repeat)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="bgBlur">Background Blur Effect</label>
                <select id="bgBlur">
                    <option value="no-blur">No Blur (Crisp)</option>
                    <option value="light-blur">Light Blur</option>
                    <option value="medium-blur" selected>Medium Blur (Default)</option>
                    <option value="heavy-blur">Heavy Blur</option>
                </select>
            </div>
            <div class="form-group">
                <button id="clearBgImage">Clear Background Image</button>
            </div>
            <div class="form-group">
                <label for="timezone1">Clock #1 Timezone</label>
                <select id="timezone1">
                    <option value="local">Local Time (Auto-detect)</option>
                    <option value="UTC">UTC</option>
                    <option value="America/New_York">Eastern Time (New York)</option>
                    <option value="America/Chicago">Central Time (Chicago)</option>
                    <option value="America/Denver">Mountain Time (Denver)</option>
                    <option value="America/Los_Angeles">Pacific Time (Los Angeles)</option>
                    <option value="America/Anchorage">Alaska Time</option>
                    <option value="Pacific/Honolulu">Hawaii Time</option>
                    <option value="Europe/London">London (GMT/BST)</option>
                    <option value="Europe/Paris">Paris (CET/CEST)</option>
                    <option value="Europe/Berlin">Berlin (CET/CEST)</option>
                    <option value="Europe/Moscow">Moscow (MSK)</option>
                    <option value="Asia/Dubai">Dubai (GST)</option>
                    <option value="Asia/Kolkata">India (IST)</option>
                    <option value="Asia/Shanghai">Shanghai (CST)</option>
                    <option value="Asia/Tokyo">Tokyo (JST)</option>
                    <option value="Asia/Seoul">Seoul (KST)</option>
                    <option value="Asia/Singapore">Singapore (SGT)</option>
                    <option value="Asia/Hong_Kong">Hong Kong (HKT)</option>
                    <option value="Asia/Ho_Chi_Minh">Vietnam (ICT)</option>
                    <option value="Australia/Sydney">Sydney (AEDT/AEST)</option>
                    <option value="Pacific/Auckland">Auckland (NZDT/NZST)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="timezone2">Clock #2 Timezone</label>
                <select id="timezone2">
                    <option value="local">Local Time (Auto-detect)</option>
                    <option value="UTC" selected>UTC</option>
                    <option value="America/New_York">Eastern Time (New York)</option>
                    <option value="America/Chicago">Central Time (Chicago)</option>
                    <option value="America/Denver">Mountain Time (Denver)</option>
                    <option value="America/Los_Angeles">Pacific Time (Los Angeles)</option>
                    <option value="America/Anchorage">Alaska Time</option>
                    <option value="Pacific/Honolulu">Hawaii Time</option>
                    <option value="Europe/London">London (GMT/BST)</option>
                    <option value="Europe/Paris">Paris (CET/CEST)</option>
                    <option value="Europe/Berlin">Berlin (CET/CEST)</option>
                    <option value="Europe/Moscow">Moscow (MSK)</option>
                    <option value="Asia/Dubai">Dubai (GST)</option>
                    <option value="Asia/Kolkata">India (IST)</option>
                    <option value="Asia/Shanghai">Shanghai (CST)</option>
                    <option value="Asia/Tokyo">Tokyo (JST)</option>
                    <option value="Asia/Seoul">Seoul (KST)</option>
                    <option value="Asia/Singapore">Singapore (SGT)</option>
                    <option value="Asia/Hong_Kong">Hong Kong (HKT)</option>
                    <option value="Asia/Ho_Chi_Minh">Vietnam (ICT)</option>
                    <option value="Australia/Sydney">Sydney (AEDT/AEST)</option>
                    <option value="Pacific/Auckland">Auckland (NZDT/NZST)</option>
                </select>
            </div>
            <div class="form-group">
                <button id="exportData">Export Data</button>
                <button id="importData">Import Data</button>
                <input type="file" id="importFile" accept=".json" style="display: none;">
            </div>
        </div>
    </div>

    <!-- Load scripts in dependency order -->
    <script src="app.js"></script>
    <script src="ui-renderer.js"></script>
    <script src="group-modal.js"></script>
    <script src="app-modal.js"></script>
</body>
</html>
